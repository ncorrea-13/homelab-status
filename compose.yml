services:
  homelab-status-api:
    build: .
    container_name: homelab-status-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT}:8080"
    volumes:
      - homelab-status-data:/data
    environment:
      - WEBHOOK_SECRET_FILE=/run/secrets/webhook_secret
      - DB_PATH=/data/status.db
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN}
    secrets:
      - webhook_secret

volumes:
  homelab-status-data:

secrets:
  webhook_secret:
    external: true
